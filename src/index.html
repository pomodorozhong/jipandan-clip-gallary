<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jipandan Voice Box</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/filter-chips.css">
  <link rel="stylesheet" href="assets/style.css">
  <script type="module">import * as FilterChips from './assets/filter-chips.mjs'; window.FilterChips = FilterChips;</script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="page">
    <!-- Finding clips first; how the board looks sits underneath, quieter. -->
    <header class="toolbar">
      <label class="searchbox"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><span class="visually-hidden">Search</span><input id="search" type="search" placeholder="Search titles, games, use cases…" autocomplete="off"></label>
      <div class="filters" id="filters" aria-label="Filters"></div>
    </header>

    <div class="viewbar">
      <div class="view-settings" aria-label="View">
        <label>Columns by <select id="columns-by"></select></label>
        <span class="view-dot" aria-hidden="true"></span>
        <label>coloured by <select id="colour-by"></select></label>
        <span class="view-dot" aria-hidden="true"></span>
        <label>sorted by <select id="sort-by"></select></label>
      </div>
      <span class="view-sep" aria-hidden="true"></span>
      <div class="legend" id="legend"></div>
      <span class="total" id="total" aria-live="polite"></span>
    </div>

    <p class="message" id="message" hidden></p>

    <main class="board-scroll">
      <div class="board" id="board"></div>
    </main>

    <!-- The selected clip: its unique name, and ways to keep or share it. Filled in by assets/app.js. -->
    <section class="clipbar" id="clipbar" aria-label="Selected clip" hidden>
      <div class="clipbar-text">
        <div class="clipbar-title" id="clipbar-title"></div>
        <div class="clipbar-meta" id="clipbar-meta"></div>
      </div>
      <code class="clipbar-name" id="clipbar-name" title="The clip's unique name: its file name, never shared by two clips"></code>
      <div class="clipbar-actions">
        <button type="button" id="clipbar-star" aria-pressed="false" title="Starred clips are kept in this browser only">☆ Star</button>
        <button type="button" id="clipbar-copy">Copy name</button>
        <button type="button" id="clipbar-link">Copy link</button>
        <button type="button" class="clipbar-close" id="clipbar-close" aria-label="Close">✕</button>
      </div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
